name: Check PR

on:
  push:
    branches: [dev, master, feat/DAWN-21/ci-tests]
  pull_request:
    branches: [dev]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set default Rust toolchain
        run: rustup default 1.79.0
      - name: Install Solana CLI
        run: sh -c "$(curl -sSfL https://release.solana.com/v1.17.0/install)"
      - name: Set Solana CLI path
        run: export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH" && solana --version && solana-keygen --version
      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v0.29.0 anchor-cli
      - name: Generate new keygen
        run: solana-keygen new
      - name: Set solana target cluster to local
        run: solana config set --url http:localhost:8899
      - name: Check solana config
        run: solana config get
      - name: Install yarn dependencies
        run: yarn install
      - name: Build
        run: anchor build
      - name: Run tests
        run: anchor test
