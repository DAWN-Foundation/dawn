<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DAWN sim viewer</title>
<style>
:root {
  --bg-primary:      #1E1E1E;
  --bg-card:         #2A2A2A;
  --bg-card-alt:     #252525;
  --border:          #3A3A3A;
  --border-strong:   #4A4A4A;
  --accent:          #E8713A;
  --accent-2:        #F08C4A;
  --accent-3:        #E8A54A;
  --green:           #2EA87E;
  --red:             #C05020;
  --text-primary:    #FFFFFF;
  --text-secondary:  #BBBBBB;
  --text-muted:      #999999;
  --text-disabled:   #666666;
  --font:            "Roboto", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  --font-mono:       "Roboto Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius-sm:       4px;
  --radius-md:       6px;
  --transition-fast: 200ms ease-out;
  --transition-med:  300ms ease-in-out;
}

* { box-sizing: border-box; }
html, body {
  height: 100%; margin: 0;
  font-family: var(--font); font-size: 13px;
  color: var(--text-secondary); background: var(--bg-primary);
}
body {
  /* Flex column so .layout fills whatever remains after header + chips,
     no matter how the chip rows wrap. */
  display: flex; flex-direction: column;
  overflow: hidden;
}
header, .gradient-strip, .chip-row { flex: 0 0 auto; }

/* Subtle radial highlight under the canvas, as if the protocol is glowing
   from within. Gives the graph some depth without fighting the dark palette. */
body::before {
  content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(circle at 35% 45%, rgba(232, 113, 58, 0.06) 0%, transparent 45%),
    radial-gradient(circle at 75% 75%, rgba(91, 141, 239, 0.04) 0%, transparent 50%);
}
body > * { position: relative; z-index: 1; }

header {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 18px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
}
header .brand {
  font-weight: 700; font-size: 14px; letter-spacing: 0.02em;
  color: var(--text-primary);
  display: flex; align-items: center; gap: 8px;
}
header .brand .accent-bar {
  display: inline-block; width: 4px; height: 18px;
  background: linear-gradient(180deg, var(--accent) 0%, var(--accent-3) 100%);
  border-radius: 2px;
}
header .brand .sub {
  color: var(--text-muted); font-weight: 400; font-size: 12px;
  letter-spacing: 0.05em; text-transform: uppercase;
}
header input[type=file] {
  font-family: var(--font); font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg-card-alt); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 6px 8px;
}
header input[type=file]::file-selector-button {
  background: transparent; color: var(--accent);
  border: 1px solid var(--accent); border-radius: 3px;
  padding: 3px 10px; margin-right: 10px;
  font-family: var(--font); font-size: 11px;
  cursor: pointer; transition: background var(--transition-fast);
}
header input[type=file]::file-selector-button:hover {
  background: rgba(232, 113, 58, 0.12);
}
header .meta {
  font-size: 11px; color: var(--text-muted);
  font-family: var(--font-mono);
}
.gradient-strip {
  height: 2px;
  background: linear-gradient(135deg, #E85D3A 0%, #F08C4A 50%, #E8A54A 100%);
}

.chip-row {
  display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
  padding: 8px 18px;
  background: var(--bg-card-alt);
  border-bottom: 1px solid var(--border);
}
.chip-row .chip-section-label {
  font-size: 10px; color: var(--text-muted);
  margin-right: 8px;
  text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700;
}
.chip {
  padding: 3px 10px; border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  cursor: pointer; user-select: none;
  font-size: 11px; line-height: 16px;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
}
.chip:hover { border-color: var(--border-strong); }
.chip.active {
  background: transparent; border-color: var(--color-fill, var(--accent));
  color: var(--color-fill, var(--accent));
}
.chip.muted { opacity: 0.4; }

.layout {
  flex: 1 1 auto;
  min-height: 0;            /* required for flex children to size to remaining space */
  display: grid;
  /* Timeline row sizes to its content (cards + chrome). Graph row
     takes whatever's left. Reactive — no hard-coded pixel guesswork. */
  grid-template-rows: 1fr min-content;
}
.layout-top {
  display: grid; grid-template-columns: 1fr 380px;
  min-height: 0;
}

#graph {
  background:
    radial-gradient(ellipse at center, rgba(255, 255, 255, 0.015) 0%, transparent 70%),
    var(--bg-primary);
  border-right: 1px solid var(--border); min-height: 0;
}

#inspector {
  background: var(--bg-card);
  padding: 14px 16px; overflow: auto;
  border-left: 1px solid var(--border);
}
#inspector h2 {
  font-size: 13px; margin: 0 0 4px;
  font-weight: 700; color: var(--text-primary);
  text-transform: uppercase; letter-spacing: 0.05em;
}
#inspector h2 .type-pill {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  font-size: 10px; font-weight: 700; vertical-align: 2px;
  background: var(--bg-card-alt); border: 1px solid var(--border);
  color: var(--text-primary); margin-left: 6px;
  text-transform: none; letter-spacing: 0;
}
#inspector .inspector-tabs {
  display: flex; gap: 2px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}
#inspector .inspector-tab {
  padding: 4px 10px;
  font-size: 11px; font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  transition: color var(--transition-fast), border-color var(--transition-fast);
  text-transform: uppercase; letter-spacing: 0.04em;
}
#inspector .inspector-tab:hover { color: var(--text-secondary); }
#inspector .inspector-tab.active {
  color: var(--text-primary);
  border-bottom-color: var(--accent);
}
#inspector .inspector-tab.has-fail { color: var(--red); }
#inspector .inspector-tab.has-fail.active { border-bottom-color: var(--red); }

#inspector .invariant-list { display: flex; flex-direction: column; gap: 4px; }
#inspector .invariant-row {
  background: var(--bg-card-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
}
#inspector .invariant-row.ok { border-color: var(--border); }
#inspector .invariant-row.fail { border-color: var(--red); }
#inspector .invariant-row.warning { border-color: var(--accent-3); }
#inspector .invariant-row-head {
  display: flex; align-items: center; gap: 8px;
}
#inspector .invariant-status {
  font-weight: 700; font-size: 14px; line-height: 1;
  flex-shrink: 0;
}
#inspector .invariant-row.ok .invariant-status { color: var(--green); }
#inspector .invariant-row.fail .invariant-status { color: var(--red); }
#inspector .invariant-name {
  font-family: var(--font-mono); font-size: 11px; color: var(--text-primary);
  flex: 1 1 auto;
}
#inspector .invariant-fail-detail {
  margin: 6px 0 0 22px;
  font-size: 11px; color: var(--text-secondary);
}
#inspector .invariant-message {
  margin: 4px 0; font-style: italic;
  color: var(--text-secondary);
}

#inspector .pubkey {
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-muted); word-break: break-all;
  margin-bottom: 6px;
}
#inspector .hash {
  font-family: var(--font-mono); font-size: 10px;
  color: var(--text-secondary);
  background: var(--bg-card-alt);
  border: 1px solid var(--border);
  padding: 6px 8px; border-radius: var(--radius-sm);
  word-break: break-all; margin: 4px 0 8px;
}
#inspector .section-label {
  font-size: 10px; color: var(--accent);
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  margin: 14px 0 6px;
}
#inspector dl { margin: 0; }
#inspector dl dt {
  font-weight: 500; color: var(--text-muted);
  margin-top: 8px; font-size: 11px;
  text-transform: uppercase; letter-spacing: 0.04em;
}
#inspector dl dd {
  margin: 2px 0 0 8px;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-primary); word-break: break-all;
}

#inspector details { margin: 2px 0 0 8px; }
#inspector details summary {
  cursor: pointer; padding: 2px 0;
  font-family: var(--font-mono); font-size: 11px;
  color: var(--text-secondary);
  list-style: none;
}
#inspector details summary::-webkit-details-marker { display: none; }
#inspector details summary::before {
  content: '▸'; display: inline-block; margin-right: 4px;
  color: var(--text-muted); transition: transform var(--transition-fast);
}
#inspector details[open] summary::before { transform: rotate(90deg); }
#inspector details summary .ref-pill {
  font-size: 9px; padding: 1px 7px; border-radius: 999px;
  margin-left: 6px; color: #1E1E1E; vertical-align: 1px;
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
}
#inspector details summary .ref-link {
  color: var(--accent); cursor: pointer;
  margin-left: 8px; font-size: 10px;
  text-transform: uppercase; letter-spacing: 0.05em;
}
#inspector details summary .ref-link:hover { color: var(--accent-2); }
#inspector details > div.ref-fields {
  margin: 6px 0 8px 18px; padding-left: 10px;
  border-left: 2px solid var(--border);
}
#inspector details > div.ref-fields .kv {
  display: flex; gap: 8px; padding: 2px 0; font-size: 11px;
  font-family: var(--font-mono);
}
#inspector details > div.ref-fields .kv .k {
  color: var(--text-muted); min-width: 110px;
}
#inspector details > div.ref-fields .kv .v {
  color: var(--text-primary);
}

#inspector .tx-list { margin-top: 14px; }
#inspector .tx-list .tx-row {
  font-size: 11px; padding: 5px 6px;
  cursor: pointer; border-radius: var(--radius-sm);
  border: 1px solid transparent;
  display: flex; align-items: center; gap: 6px;
  transition: all var(--transition-fast);
}
#inspector .tx-list .tx-row:hover {
  background: var(--bg-card-alt); border-color: var(--border);
}
#inspector .tx-list .tx-row.current {
  background: rgba(232, 113, 58, 0.10);
  border-color: var(--accent);
}
#inspector .tx-list .tx-row .ix-name {
  color: var(--text-primary); font-family: var(--font-mono);
}
#inspector .tx-list .tx-row .role {
  color: var(--text-muted); font-size: 10px;
  margin-left: auto; text-transform: uppercase; letter-spacing: 0.05em;
}
#inspector .event-breadcrumb {
  font-size: 11px; color: var(--text-muted);
  margin-bottom: 8px; line-height: 1.4;
}
#inspector .event-breadcrumb .event-crumb {
  color: var(--accent); cursor: pointer;
}
#inspector .event-breadcrumb .event-crumb:hover { color: var(--accent-2); }
#inspector .event-breadcrumb .crumb-sep { color: var(--text-disabled); margin: 0 4px; }
#inspector .event-description {
  font-size: 12px; color: var(--text-secondary); line-height: 1.55;
  background: var(--bg-card-alt);
  border-left: 2px solid var(--accent);
  padding: 8px 10px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  margin: 6px 0 10px;
}
#inspector .event-tree {
  display: flex; flex-direction: column; gap: 8px;
  margin-top: 4px;
}
#inspector .event-tree .tree-event {
  background: var(--bg-card-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 8px;
  transition: border-color var(--transition-fast);
}
#inspector .event-tree .tree-event:hover { border-color: var(--border-strong); }
#inspector .event-tree .tree-event-head {
  display: flex; align-items: center; gap: 6px;
}
#inspector .event-tree .tree-event-head .dot {
  width: 8px; height: 8px; border-radius: 50%;
}
#inspector .event-tree .tree-event-name {
  font-weight: 600; color: var(--text-primary); font-size: 12px;
}
#inspector .event-tree .tree-event-desc {
  font-size: 11px; color: var(--text-muted);
  line-height: 1.45; margin: 4px 0 4px 14px;
}
#inspector .event-tree .tree-tx-list {
  margin: 4px 0 0 14px;
  border-left: 1px solid var(--border);
  padding-left: 8px;
  display: flex; flex-direction: column; gap: 1px;
}
#inspector .event-tree .tree-tx-list .tx-row {
  padding: 2px 4px;
}

#timeline {
  background: var(--bg-card-alt);
  border-top: 1px solid var(--border);
  padding: 8px 18px 10px;
  display: grid;
  /* Three rows: callout, event-bands, tick-controls. All auto-sized
     to their content so the timeline shrinks/grows reactively as
     cards expand or collapse. */
  grid-template-rows: auto auto auto;
  gap: 6px;
  overflow: hidden;
  min-height: 0;
}

.callout-row {
  display: flex; align-items: center; gap: 12px;
}
.callout-label {
  font-size: 10px; color: var(--accent);
  font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em;
}
.callout-label::before {
  content: ''; display: inline-block;
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); margin-right: 8px; vertical-align: 1px;
  box-shadow: 0 0 8px var(--accent);
}
.callout-row .legend {
  font-size: 10px; color: var(--text-muted);
  display: inline-flex; gap: 12px; flex-wrap: wrap;
  margin-left: auto;
}
.callout-row .legend .legend-item {
  display: inline-flex; align-items: center; gap: 5px;
  color: var(--text-secondary);
}
.callout-row .legend .legend-item .dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block;
}

/* Event timeline as horizontal expandable cards. Top-level events sit
   in a flex row; click a card to expand it inline — sub-events become
   smaller cards inside their parent's body (recursively), and txs at
   the leaves render as chips. The whole row scrolls horizontally if
   expanded cards push it wide. */
#event-bands {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  /* Horizontal timeline: cards lay out left-to-right, the row scrolls
     horizontally if it grows past the viewport. Height is intrinsic
     to its tallest card — capped to keep the timeline reasonable on
     deeply-expanded scenarios, with vertical scroll as the fallback. */
  overflow-x: auto;
  overflow-y: auto;
  min-height: 0;
  max-height: 60vh;
  padding: 8px;
}
#event-bands .card-row {
  display: flex; flex-direction: row;
  gap: 8px;
  align-items: flex-start;
  flex-wrap: nowrap;
}
#event-bands .card-row.top-row {
  /* Top-level row gets `width: max-content` so the parent's overflow-x
     works (rather than the row being constrained to viewport width). */
  width: max-content;
  min-width: 100%;
}
#event-bands .event-card {
  background: var(--bg-card-alt);
  border: 1px solid var(--border);
  border-left-width: 3px;
  border-left-style: solid;
  border-radius: var(--radius-sm);
  padding: 6px 10px;
  display: flex; flex-direction: column;
  gap: 6px;
  cursor: pointer;
  flex-shrink: 0;
  min-width: 140px;
  transition: border-color var(--transition-fast),
              background var(--transition-fast),
              filter var(--transition-fast);
}
#event-bands .event-card:hover { filter: brightness(1.15); }
#event-bands .event-card.top { min-width: 200px; padding: 8px 12px; }
#event-bands .event-card.selected {
  border-color: var(--accent);
  background: rgba(232, 113, 58, 0.06);
}
#event-bands .event-card.active:not(.selected) {
  background: rgba(232, 113, 58, 0.03);
}
#event-bands .card-head {
  display: flex; align-items: center; gap: 6px;
  flex-shrink: 0;
}
#event-bands .card-chev {
  font-size: 10px;
  color: var(--text-muted);
  width: 10px; flex-shrink: 0;
}
#event-bands .card-chev.empty { color: var(--text-disabled); }
#event-bands .card-title {
  font-size: 12px; font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  text-overflow: ellipsis;
  overflow: hidden;
  flex: 1 1 auto;
  min-width: 0;
}
#event-bands .event-card.top > .card-head .card-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 700;
}
#event-bands .actor-pill {
  font-size: 9px;
  padding: 1px 6px;
  border-radius: 999px;
  color: #1E1E1E;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  flex-shrink: 0;
}
#event-bands .card-meta {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-muted);
  display: flex; gap: 8px;
  white-space: nowrap;
  flex-shrink: 0;
}
#event-bands .card-body {
  display: flex; flex-direction: column;
  gap: 6px;
  margin-top: 2px;
  border-top: 1px solid var(--border);
  padding-top: 6px;
}
#event-bands .card-desc {
  font-size: 11px;
  color: var(--text-secondary);
  line-height: 1.4;
  max-width: 320px;
  /* Card descriptions clamp to 2 lines so cards stay short and the
     timeline doesn't grow vertical. The full text lives in the right-
     pane inspector when an event is selected. */
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
#event-bands .tx-chip-row {
  display: flex; flex-direction: row;
  flex-wrap: wrap; gap: 4px;
  align-items: center;
}
#event-bands .tx-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px 2px 6px;
  border-radius: 999px;
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 700;
  color: #1E1E1E;
  border: 1px solid rgba(0, 0, 0, 0.25);
  cursor: pointer;
  white-space: nowrap;
  transition: filter var(--transition-fast), transform var(--transition-fast);
}
#event-bands .tx-chip:hover { filter: brightness(1.2); transform: translateY(-1px); }
#event-bands .tx-chip.current {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
  box-shadow: 0 0 8px rgba(232, 113, 58, 0.5);
}
/* Red ring on tx chips whose tick has any failed invariant. */
#event-bands .tx-chip.invariant-fail {
  outline: 2px solid var(--red);
  outline-offset: 2px;
  box-shadow: 0 0 8px rgba(192, 80, 32, 0.55);
}
#event-bands .tx-chip.invariant-fail.current {
  outline: 2px solid var(--red);
  box-shadow: 0 0 10px var(--red);
}
/* When the "only failed" filter is active, fade non-failing chips. */
#event-bands.show-failed-only .tx-chip:not(.invariant-fail) {
  opacity: 0.18;
  filter: saturate(0.3);
}
#event-bands .tx-chip .tx-tick {
  background: rgba(0, 0, 0, 0.3); color: #FFFFFF;
  padding: 0 5px; border-radius: 999px;
  font-size: 9px;
}


#tick-controls {
  display: flex; align-items: center; gap: 12px;
  padding-top: 8px;
  border-top: 1px dashed var(--border);
}
#tick-controls .tick-arrow {
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--accent);
  cursor: pointer;
  font-size: 20px; font-weight: 700; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: all var(--transition-fast);
  font-family: var(--font);
  flex-shrink: 0;
}
#tick-controls .tick-arrow:hover {
  background: rgba(232, 113, 58, 0.15);
  border-color: var(--accent);
}
#tick-controls .tick-arrow:disabled {
  opacity: 0.3; cursor: not-allowed;
}
#tick-controls .tick-display {
  display: flex; flex-direction: column; gap: 2px;
  min-width: 90px;
}
#tick-controls .tick-display .tick-num {
  font-family: var(--font-mono); color: var(--text-primary);
  font-size: 18px; font-weight: 700; line-height: 1;
}
#tick-controls .tick-display .tick-sub {
  font-size: 9px; color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.08em;
}
#tick-controls #scrubber-wrap {
  flex: 1; display: flex; align-items: center; gap: 8px;
}
#timeline-scrubber {
  flex: 1; min-width: 160px;
  -webkit-appearance: none; appearance: none;
  height: 4px; background: var(--bg-primary); border-radius: 2px;
  outline: none;
}
#timeline-scrubber::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
  border: 2px solid var(--bg-primary);
  box-shadow: 0 0 0 1px var(--accent);
}
#timeline-scrubber::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
  border: 2px solid var(--bg-primary);
}

.muted-text { color: var(--text-disabled); font-style: italic; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb {
  background: var(--bg-card); border-radius: 5px;
  border: 2px solid var(--bg-primary);
}
::-webkit-scrollbar-thumb:hover { background: var(--accent); }
</style>
</head>
<body>
<header>
  <span class="brand"><span class="accent-bar"></span>DAWN <span class="sub">sim viewer</span></span>
  <input type="file" id="file-input" accept=".jsonl">
  <span class="meta" id="meta-line">no trace loaded</span>
</header>
<div class="gradient-strip"></div>
<div class="chip-row" id="macro-chips"><span class="chip-section-label">Domain</span></div>
<div class="chip-row" id="type-chips"><span class="chip-section-label">Types</span></div>

<div class="layout">
  <div class="layout-top">
    <div id="graph"></div>

  </div>
  <div id="timeline">
    <div class="callout-row">
      <span class="callout-label">Event Timeline</span>
      <span class="chip" id="failed-only-chip" style="display:none">Only failed invariants</span>

      <button class="tick-arrow" id="tick-next" title="Next tick (→)">›</button>

      </div>
    </div>
