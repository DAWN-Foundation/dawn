[package]
name = "plan"
version = "0.1.0"
description = "DAWN Plan Subscription Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "plan"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
raydium-clmm = { path = "../../raydium", features = ["no-entrypoint", "cpi"] }
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
