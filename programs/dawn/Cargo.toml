[package]
name = "dawn"
version = "1.1.0"
description = "DAWN Protocol Program"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "dawn"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
devnet = ["raydium-cp-swap/devnet"]
mainnet = []
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
mpl-token-metadata = "5.1.1"
solana-program = "2"
raydium-cp-swap = { git = "https://github.com/raydium-io/raydium-cp-swap", rev = "609780f165d234a0aa9699cac90178a3fa36fd43", default-features = false, features = [
    "no-entrypoint",
    "cpi",
] }
spl-memo = "6.0.0"

[build-dependencies]
toml = "0.7"
